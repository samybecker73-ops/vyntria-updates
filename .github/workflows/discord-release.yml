name: KAVIO Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  announce:
    name: Announce VYNTRIA release in Discord
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate source changes and announce release
        uses: actions/github-script@v7
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_APP_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_APP_RELEASE_WEBHOOK_URL }}
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          APP_NAME: "VYNTRIA"
          SOURCE_REPOSITORY: "samybecker73-ops/vyntria"
          SOURCE_BRANCH: "main"
          BASELINE_PATH: ".kavio/source-baseline.json"
        with:
          script: |
            const webhook = process.env.DISCORD_RELEASE_WEBHOOK_URL;
            if (!webhook) {
              core.warning('Secret DISCORD_RELEASE_WEBHOOK_URL absent : annonce Discord ignorée.');
              return;
            }

            const release = context.payload.release;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const app = process.env.APP_NAME;
            const sourceRepo = process.env.SOURCE_REPOSITORY;
            const sourceBranch = process.env.SOURCE_BRANCH;
            const sourceToken = process.env.SOURCE_REPO_TOKEN;

            let comparisonSucceeded = false;
            let sourceHeadSha = '';
            let baselineFile = null;
            let generatedNotes = '';

            if (!sourceToken) {
              core.warning('SOURCE_REPO_TOKEN absent : seules les notes manuelles de la Release seront annoncées.');
            } else {
              try {
                const { data: baselineResponse } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: process.env.BASELINE_PATH
                });
                baselineFile = baselineResponse;
                const baseline = JSON.parse(Buffer.from(baselineResponse.content, 'base64').toString('utf8'));
                const baselineSha = baseline.last_released_source_sha;

                if (!baselineSha) throw new Error('Le SHA de référence est absent du fichier de baseline.');

                const sourceGet = async function(path) {
                  const response = await fetch('https://api.github.com' + path, {
                    headers: {
                      Authorization: 'Bearer ' + sourceToken,
                      Accept: 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'
                    }
                  });
                  if (!response.ok) {
                    throw new Error('GitHub Source API ' + response.status + ' sur ' + path);
                  }
                  return await response.json();
                };

                const head = await sourceGet('/repos/' + sourceRepo + '/commits/' + encodeURIComponent(sourceBranch));
                sourceHeadSha = head.sha;

                if (sourceHeadSha !== baselineSha) {
                  const comparison = await sourceGet(
                    '/repos/' + sourceRepo + '/compare/' + encodeURIComponent(baselineSha) + '...' +
                    encodeURIComponent(sourceHeadSha) + '?per_page=100'
                  );
                  if (comparison.status === 'diverged') {
                    throw new Error('La branche source a divergé de la référence de la version précédente.');
                  }

                  const groups = {
                    'Fonctionnalités': [],
                    'Corrections': [],
                    'Améliorations': [],
                    'Autres modifications': []
                  };

                  for (const item of (comparison.commits || [])) {
                    const title = (((item.commit || {}).message) || '').split('\n')[0].trim();
                    if (!title || /^(merge pull request|merge branch)\b/i.test(title)) continue;
                    if (/^(ci|chore|docs|test|build|style)(\([^)]+\))?:/i.test(title)) continue;

                    if (/^(feat|feature)(\([^)]+\))?:/i.test(title)) groups['Fonctionnalités'].push(title.replace(/^[^:]+:\s*/, ''));
                    else if (/^(fix|bugfix)(\([^)]+\))?:/i.test(title)) groups['Corrections'].push(title.replace(/^[^:]+:\s*/, ''));
                    else if (/^(perf|refactor|security|improve|enhancement)(\([^)]+\))?:/i.test(title)) groups['Améliorations'].push(title.replace(/^[^:]+:\s*/, ''));
                    else groups['Autres modifications'].push(title);
                  }

                  const sections = [];
                  for (const label of Object.keys(groups)) {
                    const items = [...new Set(groups[label])];
                    if (items.length) {
                      sections.push('**' + label + '**\n' + items.slice(0, 12).map(value => '• ' + value).join('\n'));
                      if (items.length > 12) sections.push('• ' + (items.length - 12) + ' autre(s) changement(s) dans le dépôt.');
                    }
                  }

                  if (sections.length) {
                    generatedNotes = '## Changements depuis la version précédente\n' +
                      'Résumé automatique des commits du dépôt source (' + comparison.total_commits + ' commit(s) comparé(s)) :\n\n' +
                      sections.join('\n\n');
                  }
                } else {
                  core.info('Aucun nouveau commit source depuis la dernière version publiée.');
                }

                comparisonSucceeded = true;
              } catch (error) {
                core.warning('Impossible de comparer le dépôt source privé : ' + error.message);
              }
            }

            const originalBody = (release.body || '').trim();
            const intro = '**VYNTRIA — l’environnement numérique modulaire de KAVIO.**\n' +
              'Organisé autour de neuf centres, VYNTRIA réunit des outils pour gérer produits et sites, fichiers et médias, projets et tâches locales, ressources, diagnostic système et développement. La version 0.11.0 apporte également un coffre de sécurité local chiffré AES-256-GCM et la vérification SHA-256 des mises à jour.\n\n';
            const finalBody = intro + ([generatedNotes, originalBody].filter(Boolean).join('\n\n') ||
              'Une nouvelle version stable est disponible. Consulte la publication GitHub pour découvrir les nouveautés et télécharger la mise à jour.');

            // Le résumé est conservé pour Discord uniquement. Ne pas modifier la Release GitHub.

            const payload = {
              username: 'KAVIO Updates',
              embeds: [{
                title: app + ' — ' + (release.tag_name || 'Nouvelle version'),
                url: release.html_url,
                description: finalBody.slice(0, 3500),
                color: 12632256,
                image: {
                  url: 'https://raw.githubusercontent.com/samybecker73-ops/vyntria-updates/main/assets/discord/vyntria-logo.webp'
                },
                fields: [
                  { name: 'Application', value: app, inline: true },
                  { name: 'Version', value: release.tag_name || 'Non précisée', inline: true }
                ],
                footer: { text: 'KAVIO • Publication officielle • ' + app },
                timestamp: release.published_at || new Date().toISOString()
              }],
              allowed_mentions: { parse: [] }
            };

            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const detail = await response.text();
              throw new Error('Échec du webhook Discord (' + response.status + ') : ' + detail.slice(0, 500));
            }
            core.info('Annonce Discord envoyée pour ' + app + ' ' + release.tag_name + '.');

            const appWebhook = process.env.DISCORD_APP_RELEASE_WEBHOOK_URL;
            if (appWebhook) {
              const appResponse = await fetch(appWebhook, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (!appResponse.ok) {
                const detail = await appResponse.text();
                throw new Error('Échec de l’annonce Discord dans le salon dédié : ' + appResponse.status + ' — ' + detail.slice(0, 500));
              }
              core.info('Annonce VYNTRIA envoyée dans le salon dédié.');
            } else {
              core.warning('Secret DISCORD_APP_RELEASE_WEBHOOK_URL absent : annonce envoyée uniquement dans #notes-de-version. Ajoute le webhook du salon applicatif dans les secrets Actions de ce dépôt.');
            }

            if (comparisonSucceeded && sourceHeadSha && baselineFile) {
              const nextBaseline = {
                source_repository: sourceRepo,
                source_branch: sourceBranch,
                last_released_source_sha: sourceHeadSha,
                last_release_tag: release.tag_name,
                updated_at: new Date().toISOString()
              };
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: process.env.BASELINE_PATH,
                message: 'chore: update source baseline after ' + app + ' ' + release.tag_name,
                content: Buffer.from(JSON.stringify(nextBaseline, null, 2) + '\n').toString('base64'),
                sha: baselineFile.sha,
                branch: context.payload.repository.default_branch
              });
              core.info('Référence source enregistrée pour la prochaine comparaison.');
            }
